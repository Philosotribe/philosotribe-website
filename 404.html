      rel="stylesheet"
    >
    <script>
      (function () {
        window.PHILOSOTRIBE_ASSET_ROOT = "";
        document.write('<script src="assets/js/site-version.js?bootstrap=' + Date.now() + '"><\/script>');
      }());
    </script>
    <script>
      (function () {
        const version = window.PHILOSOTRIBE_SITE_VERSION || "uncached";
        window.PHILOSOTRIBE_ASSET_VERSION = version;

        window.philosotribeAssetUrl = function (url) {
          if (!url || /^(?:data:|blob:|mailto:|tel:|javascript:)/i.test(url)) {
            return url;
          }

          try {
            const absolute = new URL(url, window.location.href);
            if (absolute.origin !== window.location.origin) {
              return url;
            }
          } catch (_) {
            return url;
          }

          const hashIndex = url.indexOf("#");
          const hash = hashIndex >= 0 ? url.slice(hashIndex) : "";
          const withoutHash = hashIndex >= 0 ? url.slice(0, hashIndex) : url;
          const queryIndex = withoutHash.indexOf("?");
          const path = queryIndex >= 0 ? withoutHash.slice(0, queryIndex) : withoutHash;
          const query = queryIndex >= 0 ? withoutHash.slice(queryIndex + 1) : "";
          const params = new URLSearchParams(query);
          params.set("v", version);
          return path + "?" + params.toString() + hash;
        };

        // If this browser has an older cached copy of this page, force a one-time
        // navigation to a versioned HTML URL when the site version changes.
        try {
          const pageKey = "philosotribe-page-version:" + window.location.pathname;
          const previousVersion = window.localStorage.getItem(pageKey);
          const pageUrl = new URL(window.location.href);
          const urlVersion = pageUrl.searchParams.get("_sitev");
          const versionChanged = previousVersion && previousVersion !== version;
          const staleVersionedUrl = urlVersion && urlVersion !== version;

          window.localStorage.setItem(pageKey, version);

          if ((versionChanged || staleVersionedUrl) && urlVersion !== version) {
            pageUrl.searchParams.set("_sitev", version);
            window.location.replace(pageUrl.toString());
            return;
          }
        } catch (_) {
          // Cache-busting of CSS, JS, and images still works when storage is disabled.
        }

        document.querySelectorAll('link[rel~="icon"], link[rel="apple-touch-icon"]').forEach((link) => {
          const href = link.getAttribute("href");
          if (href) {
            link.setAttribute("href", window.philosotribeAssetUrl(href));
          }
        });

        document.write('<link rel="stylesheet" href="' + window.philosotribeAssetUrl("assets/css/styles.css") + '">');
      }());
    </script>
    <noscript><link rel="stylesheet" href="assets/css/styles.css?v=2026-08-21-5"></noscript>

<main id="main">

            or contact us if you expected something specific to be here.
          </p>

            <a class="button button-secondary" href="plant-care.html">Open Plant Care</a>
            <a class="button button-secondary" href="contact.html">Contact Us</a>
          </div>
        </div>
      </section>
    </main>

    <footer class="site-footer" data-site-footer></footer>
<script>


      document.write('<script src="' + window.philosotribeAssetUrl("assets/js/site-navigation.js") + '"><\/script>');



      document.write('<script src="' + window.philosotribeAssetUrl("assets/js/main.js") + '"><\/script>');


    </script>
